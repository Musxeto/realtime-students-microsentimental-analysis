<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-only.png" />
    <link rel="apple-touch-icon" href="/images/logo-only.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngageAI | Micro-Sentimental Analysis</title>
    <script>
      (function () {
        var key = 'classpulse_theme'
        var saved = localStorage.getItem(key)
        var normalized = saved ? String(saved).trim().toLowerCase() : null
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var mode = normalized === 'light' || normalized === 'dark' ? normalized : (prefersDark ? 'dark' : 'light')
        if (mode === 'dark') {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
